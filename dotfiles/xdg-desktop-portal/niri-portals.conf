# Portal backend routing for the niri session (XDG_CURRENT_DESKTOP=niri, set
# by porter from niri.desktop).  Shadows the niri-portals.conf niri ships.
#
# gnome: ScreenCast/Screenshot/RemoteDesktop via niri's Mutter-compatible
#   D-Bus API (window-level sharing, niri's picker, block-out-from rules).
# gtk:   FileChooser -- gnome's needs Nautilus, which isn't installed.
# Secret: not routed; no keyring daemon runs (niri's default points at
#   gnome-keyring).
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
