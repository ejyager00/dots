# Portal backend routing for the sway session.  porter sets
# XDG_CURRENT_DESKTOP from sway.desktop's DesktopNames (sway:wlroots), so this
# file is picked over any generic portals.conf; other sessions (niri) get
# their own <desktop>-portals.conf and never route to wlr.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
