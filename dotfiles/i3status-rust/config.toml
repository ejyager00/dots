# Emit no per-block color/background so swaybar falls back to the bar's own
# statusline/background colors (sway/config bar{colors{}}) instead of the
# default "plain" theme's hardcoded black block backgrounds.
[theme]
theme = "native"

[[block]]
block = "sound"
step_width = 5

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%Y-%m-%d %X') "
